name: Receive OSV-informed dependency repair
on:
  push:
    branches: [feat/receive-real-osv-remediation-20261024]
    paths: [".github/workflows/receive-osv-remediation.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: exact-buyer-osv-remediation
  cancel-in-progress: false
jobs:
  real-buyer-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read original published OSV-scanning supplier
        uses: actions/checkout@v4
        with:
          repository: red-cup-engineering/jsnode-package-vulnerability-triage-engineering-services-section
          ref: f93653a22f1896100e1d20e9d0cd3e868cd9c15b
          path: source-cve
          persist-credentials: false
      - name: Form exact current and prospective native npm trees
        run: |
          set -euo pipefail
          cp package-lock.json "$RUNNER_TEMP/previous-package-lock.json"
          npm update --package-lock-only --ignore-scripts --no-audit --no-fund
          if cmp -s package-lock.json "$RUNNER_TEMP/previous-package-lock.json"; then
            echo 'Current registry has no in-range dependency improvements; do not self-publish unchanged code'
            exit 2
          fi
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Independently receive buyer behavior and both real OSV readings
        run: |
          set -euo pipefail
          npm run verify
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { scanRepositoryCves } from './source-cve/src/scan-repository-cves.mjs';
          const previous=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/previous-package-lock.json','utf8'));
          const current=JSON.parse(readFileSync('package-lock.json','utf8'));
          const before=await scanRepositoryCves({packageLock:previous});
          const after=await scanRepositoryCves({packageLock:current});
          if(!before.coverage.complete||!after.coverage.complete)throw new Error('source evidence was incomplete');
          const identity=x=>x.component.name+'@'+x.component.version+'|'+x.advisory.id;
          const oldSet=new Set(before.findings.map(identity));
          const newSet=new Set(after.findings.map(identity));
          const removed=[...oldSet].filter(x=>!newSet.has(x)).sort();
          const added=[...newSet].filter(x=>!oldSet.has(x)).sort();
          const report={
            originalBuyer:'red-cup-engineering/x402-exact-purchase-service',
            nativeBuyerTests:'npm run verify passed against the updated install',
            former:{examined:before.coverage.examined,findings:before.findings.length},
            updated:{examined:after.coverage.examined,findings:after.findings.length},
            removed,added,
            method:'official OSV exact-version matching; no runtime exploitability claim',
            cashPurchaseExecuted:false
          };
          console.log(JSON.stringify(report));
          if(removed.length===0||after.findings.length>=before.findings.length||added.length>0)
            throw new Error('real source/version evidence did not establish unambiguous advisory decrease; decline commit');
          writeFileSync('security-report.json',JSON.stringify(report,null,2)+'\n');
          NODE
      - name: Commit qualified original lock repair
        run: |
          set -euo pipefail
          test -s security-report.json
          git config user.name '561 Group native dependency receiving'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet && exit 3
          baseline="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin refs/heads/feat/receive-real-osv-remediation-20261024 | cut -f1)"
          test "$baseline" = "$remote" || { echo 'Concurrent head: hold'; exit 4; }
          git commit -m 'Receive native-tested reduction of actual OSV advisories in buyer lock'
          git push origin HEAD:refs/heads/feat/receive-real-osv-remediation-20261024
      - name: Preserve measured before/after evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observed-buyer-osv-remediation
          path: security-report.json
          if-no-files-found: ignore
          retention-days: 7
