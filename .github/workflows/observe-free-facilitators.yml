name: Observe candidate no-fee x402 facilitator capabilities
on:
  push:
    branches: [main, feat/observe-free-mainnet-facilitators-20261024]
    paths: [".github/workflows/observe-free-facilitators.yml"]
  schedule:
    - cron: "37 10 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: x402-original-buyer-facilitator-options
  cancel-in-progress: false
jobs:
  observe-real-provider-capabilities:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install exact original buyer supplier dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Observe real official x402 v2 /supported interfaces without spending
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {HTTPFacilitatorClient} from '@x402/core/server';
          import {mkdirSync,writeFileSync} from 'node:fs';
          const providers=[
            {name:'Covenant',url:'https://facilitator.opencovenant.org',
              vendorTerms:'https://docs.opencovenant.org/build-with-x402',
              advertisedFreeSponsoredGas:true,documentedDailyCapPerReceivingAddress:500,
              independentlyObservedFeeAssurance:'unknown',independentComplianceScreening:'unknown'},
            {name:'xpay',url:'https://facilitator.xpay.sh',
              vendorTerms:'https://docs.xpay.sh/en/x402-protocol/facilitator',
              advertisedFreeSponsoredGas:true,documentedSettlePerMinute:50,
              independentlyObservedFeeAssurance:'unknown',independentComplianceScreening:'not established by vendor documentation'},
          ];
          const rows=[];
          for(const row of providers) {
            try {
              const started=performance.now();
              const observed=await new HTTPFacilitatorClient({url:row.url}).getSupported();
              const kinds=Array.isArray(observed.kinds)?observed.kinds:[];
              const present=kinds.some(kind=>kind.x402Version===2&&
                kind.network==='eip155:8453'&&kind.scheme==='exact');
              const signers=observed.signers?.['eip155:8453']??observed.signers?.['eip155:*']??[];
              rows.push({...row,observed:true,
                x402V2ExactBaseDeclared:present,
                signersAdvertised:Array.isArray(signers)?signers.length:0,
                latencyMs:Math.round(performance.now()-started),
                paymentAttempted:false,settlementAttempted:false,
                operationallyVerified:false,legallyCleared:false});
            }catch(error) {
              rows.push({...row,observed:false,x402V2ExactBaseDeclared:false,
                refusal:String(error?.message??error).slice(0,400),
                paymentAttempted:false,settlementAttempted:false});
            }
          }
          const report={
            kind:'original-x402-buyer-mainnet-facilitator-options/v1',
            at:new Date().toISOString(),
            source:'official @x402/core@2.19.0 HTTPFacilitatorClient.getSupported',
            buyerWork:'strict zero-new-cash seller settlement supplier options',
            currentMerchant:'market.561.group; currently configured separately for authenticated Coinbase CDP',
            decision:'source-qualified candidates only, no merchant selection, commitment or paid transaction',
            network:'eip155:8453',asset:'0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913',
            providers:rows
          };
          mkdirSync('content/observations/x402-facilitator-options',{recursive:true});
          writeFileSync('content/observations/x402-facilitator-options/current.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(rows.map(x=>({name:x.name,observed:x.observed,
            base:x.x402V2ExactBaseDeclared,signers:x.signersAdvertised,
            error:x.refusal??null}))));
          NODE
      - name: Receive actual read-only provider facts at the original public buyer
        run: |
          set -euo pipefail
          destination='content/observations/x402-facilitator-options/current.json'
          cp "$destination" "$RUNNER_TEMP/next-options.json"
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          base="$(git rev-parse FETCH_HEAD)"
          git reset --hard "$base"
          cp "$RUNNER_TEMP/next-options.json" "$destination"
          git config user.name '561 Group buyer-supply observation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination"
          git diff --cached --quiet && exit 0
          git commit -m 'Observe actual no-fee facilitator supported schemes, unsigned'
          git push origin "HEAD:$GITHUB_REF_NAME"
